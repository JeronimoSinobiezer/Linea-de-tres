<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Línea de tres · Análisis de fútbol y NBA</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#ece7dc;--fg:#15130f;--mut:#6b665b;--line:rgba(21,19,15,.22);--card:#f6f2e8;--ac:#c0301c;--hl:#ffd23f;--ac2:#f2b632;--blue:#7fb0ff;--board:#10331f;--chalk:#e9f2ec;--disp:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#141311;--fg:#ece7dc;--mut:#a49e90;--line:rgba(236,231,220,.22);--card:#1c1b18;--ac:#ff6a4d}}
body[data-sport="nba"]{--board:#6b3f1d;--chalk:#fbeede}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:19px/1.65 Newsreader,Georgia,serif}
a{color:inherit}h1,h2,h3,button,.lab{font-family:var(--disp)}
main{max-width:1080px;margin:0 auto;padding:18px 20px 70px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px solid var(--fg);padding-bottom:10px}
.brand{font:900 24px/1 var(--disp);letter-spacing:.05em;text-transform:uppercase;text-decoration:none}
.tl,.cap,.kick,.back,.sec,.tag,.dt0,.es,.go,#flt button{font-family:var(--mono)}
.tl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
button:focus-visible,a:focus-visible,.pl:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
.hero{position:relative;isolation:isolate;padding:62px 0 6px}
.kick{font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);margin:12px 0 0}
.np{font:900 clamp(78px,27vw,270px)/.88 var(--disp);letter-spacing:-.012em;text-transform:uppercase;margin:0}
.np span{display:block;width:fit-content;background:linear-gradient(var(--hl),var(--hl)) 0 100%/100% .14em no-repeat;padding-bottom:.06em;animation:ul .9s .8s cubic-bezier(.2,.8,.2,1) both}
.dek{font:italic 400 clamp(18px,2.4vw,22px)/1.35 Newsreader,Georgia,serif;max-width:34ch;margin:22px 0 0}
.hl{position:absolute;right:0;top:60px;width:min(46vw,400px);color:var(--fg);z-index:-1}
.hl path{fill:none;stroke:currentColor;stroke-width:1.6;stroke-dasharray:1;animation:draw 1.8s ease-out both}
.hl path:nth-child(2){animation-delay:.25s}.hl path:nth-child(3){animation-delay:.5s}
#flt{display:flex;gap:24px;margin-top:30px;border-top:1px solid var(--line);padding-top:12px}
#flt button{all:unset;cursor:pointer;font:500 13px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);padding:4px 0;border-bottom:2px solid transparent}
#flt button[aria-pressed="true"]{color:var(--fg);border-color:var(--ac)}
#flt button:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
.lead{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:center;text-decoration:none;margin-top:18px;padding:26px 0;border-top:2px solid var(--fg);border-bottom:1px solid var(--line)}
.lead[data-s="futbol"]{--board:#10331f;--chalk:#e9f2ec}.lead[data-s="nba"]{--board:#6b3f1d;--chalk:#fbeede}
.tag,.dt0{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ac)}
.lead h2{font:900 clamp(30px,5vw,56px)/.95 var(--disp);text-transform:uppercase;margin:10px 0 12px;letter-spacing:0}
.big{font:900 clamp(60px,11vw,130px)/.85 var(--disp);font-variant-numeric:tabular-nums;color:transparent;-webkit-text-stroke:2px var(--fg);background:linear-gradient(var(--hl),var(--hl)) 0 0/0% 100% no-repeat;-webkit-background-clip:text;background-clip:text;transition:background-size 1s cubic-bezier(.2,.8,.2,1),color .25s}.big.fill{background-size:100% 100%}
.lead:hover .big,.lead:focus-visible .big{color:var(--hl)}
.lead p{margin:14px 0 0}.go{font-size:13px;letter-spacing:.12em;text-transform:uppercase;border-bottom:2px solid var(--ac);padding-bottom:2px}
.mp{background:var(--board);padding:12px}.mp svg{display:block;width:100%;height:auto}
.sec{font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;border-top:2px solid var(--fg);padding-top:10px;margin:52px 0 16px}
.rows{border-top:2px solid var(--fg)}
.row{display:grid;grid-template-columns:170px 1fr auto 110px 20px;gap:18px;align-items:baseline;padding:16px 8px;border-bottom:1px solid var(--line);text-decoration:none;transition:background .2s,padding .25s}
.row:hover,.row:focus-visible{background:var(--hl);color:#15130f;padding-left:18px}
.row:hover .dt0,.row:hover .es{color:#15130f}
.row h3{font:800 clamp(24px,4vw,36px)/1 var(--disp);text-transform:uppercase;margin:0}
.row .sc{font:900 clamp(28px,5vw,44px)/1 var(--disp)}.es{font-size:12px;color:var(--mut)}
.back{display:inline-block;margin:20px 0 4px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--mut)}.back:hover{color:var(--ac)}
#h1{font:900 clamp(40px,10.5vw,124px)/.9 var(--disp);text-transform:uppercase;margin:6px 0 12px}
#h1 .sc{display:inline-block;background:var(--hl);color:#15130f;padding:0 .12em;transform:rotate(-2deg);margin:0 .06em}
.sub{font:italic 400 clamp(19px,2.6vw,24px)/1.35 Newsreader,Georgia,serif;max-width:40ch;margin:0 0 22px}
.stage{background:var(--board);padding:16px;transition:background .4s}
.stage svg{display:block;width:100%;height:auto;max-height:72vh}
.cap{font-size:12px;letter-spacing:.05em;color:var(--mut);margin:8px 0 0}
.ln{fill:none;stroke:var(--chalk);stroke-opacity:.55;stroke-width:.4}
.pl{cursor:pointer}.pl .ring{fill:var(--chalk);stroke-width:1}
.pl.A .ring{stroke:var(--ac2)}.pl.B .ring{stroke:var(--blue)}.pl.on .ring{fill:#fff;stroke-width:1.8}
.pl .ini{font:900 3px var(--disp);fill:var(--board);text-anchor:middle}
.pl .nm{font:700 2.3px var(--mono);fill:var(--chalk);text-anchor:middle;stroke:var(--board);stroke-width:.7;paint-order:stroke}
#vw{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
#vw button{border:1px solid var(--chalk);background:none;color:var(--chalk);padding:5px 14px;font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
#vw button[aria-pressed="true"]{background:var(--chalk);color:var(--board)}
#vw i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
#info{display:flex;gap:14px;align-items:center;margin-top:12px;color:var(--chalk);min-height:76px}
#info img,#info .ph{width:72px;height:72px;border-radius:50%;object-fit:cover;flex:none;background:var(--chalk);color:var(--board);display:grid;place-items:center;font:900 28px var(--disp)}
#info b{font:900 24px var(--disp);text-transform:uppercase;display:block;line-height:1}#info small{opacity:.8}#info p{margin:0;font-size:16px}
.lect{columns:2 20rem;column-gap:44px;white-space:pre-line;margin:0}
.lect::first-letter{font:900 4.6em/.78 var(--disp);float:left;padding:.06em .1em 0 0}
.vs{display:flex;justify-content:space-between;font:800 22px var(--disp);text-transform:uppercase;margin:6px 0 12px}
.m{margin:0 0 16px}.m .lab{font:400 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:center;margin-bottom:4px}
.split{display:flex;height:34px;background:var(--line);gap:3px}
.split span{display:flex;align-items:center;font:900 20px var(--disp);color:#15130f;padding:0 10px;width:50%;transition:width .9s cubic-bezier(.2,.8,.2,1);white-space:nowrap}
.split .a{background:var(--ac2)}.split .b{background:var(--blue);justify-content:flex-end}
.dt{fill:var(--chalk);transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}.dt.A{fill:var(--ac2)}.dt.B{fill:var(--blue)}
.up{animation:up .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(26px)}}@keyframes draw{from{stroke-dashoffset:1}}@keyframes ul{from{background-size:0 .14em}}@keyframes pop{from{transform:scale(0);opacity:0}}
.rv{opacity:0;transform:translateY(34px);transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1),background .2s,padding .25s}.rv.in{opacity:1;transform:none}
.vin{animation:view .55s cubic-bezier(.2,.8,.2,1) both}
.lead{animation:swap .6s cubic-bezier(.2,.8,.2,1) both}
#h1 .sc.stamp{animation:stamp .6s .3s cubic-bezier(.2,1.4,.4,1) both}
.row i{transition:transform .25s}.row:hover i{transform:translateX(6px)}
.ld .ln{stroke-dasharray:1;animation:draw 1.5s ease-out both;animation-play-state:paused}.ld.go .ln{animation-play-state:running}
.dl{fill:none;stroke-width:.45;stroke-dasharray:1;stroke-linecap:round;animation:draw 1.1s ease-out both}.dl.A{stroke:var(--ac2)}.dl.B{stroke:var(--blue)}
.ball{fill:#fff;stroke:#15130f;stroke-width:.4}
@keyframes view{from{opacity:0;transform:translateY(18px)}}@keyframes swap{from{opacity:0;transform:translateY(14px)}}@keyframes stamp{from{opacity:0;transform:rotate(-2deg) scale(1.6)}}
@media (max-width:760px){.lead{grid-template-columns:1fr}.row{grid-template-columns:1fr auto;gap:4px 12px}.row .dt0{grid-column:1/-1}.row i{display:none}.hl{opacity:.25}.tl{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.rv{opacity:1;transform:none}}
/* editor */
#ed{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 18px 20px;margin-top:24px}
#ed h2{margin:14px 0 4px}#ed h3{font-size:17px;margin:14px 0 8px}
.fl{display:block;font:500 14px "Bricolage Grotesque",sans-serif;color:var(--mut);margin-bottom:10px}
#ed input,#ed textarea,#ed select{display:block;width:100%;font:16px/1.4 Newsreader,Georgia,serif;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-top:4px}
#ed textarea{min-height:110px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.prow,.drow{display:grid;gap:6px;margin-bottom:6px;align-items:center}
.prow{grid-template-columns:1.1fr .9fr 1.6fr}.drow{grid-template-columns:1fr 70px 70px auto}
.prow input,.drow input{margin:0!important}
.mini{border:1px solid var(--line);background:none;color:var(--fg);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer;margin:2px 8px 2px 0}
.mini.ok{background:var(--ac);color:#fff;border-color:var(--ac)}.mini.del{color:#c0392b}
.hint{margin:0 0 8px;font-size:14px;color:var(--mut)}
@media (max-width:700px){.two{grid-template-columns:1fr}.prow{grid-template-columns:1fr 1fr}.prow input:last-child{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body data-sport="futbol">
<main>
<header>
  <a class="brand" id="brand" href="#/"></a>
  <span class="tl">Fútbol · NBA · Análisis</span>
</header>
<div id="inicio">
  <div class="hero">
    <svg class="hl" viewBox="0 0 160 100" aria-hidden="true"><path pathLength="1" d="M150 32A18 18 0 0 0 150 68"/><path pathLength="1" d="M150 18A32 32 0 0 0 150 82"/><path pathLength="1" d="M150 4A46 46 0 0 0 150 96"/></svg>
    <h1 class="np up">Línea<span>de tres</span></h1>
    <p class="dek up" style="animation-delay:.35s">Cómo se paró cada equipo, partido por partido, con la pizarra y mi lectura.</p>
    <p class="kick up" style="animation-delay:.5s">Fútbol · NBA · Análisis</p>
  </div>
  <div id="flt" class="up" style="animation-delay:.5s" role="group" aria-label="Filtrar por deporte"></div>
  <div id="dest"></div>
  <h2 class="sec" id="mas" hidden>Más partidos</h2>
  <div class="rows" id="grid"></div>
</div>
<div id="vpartido" hidden>
<a class="back" href="#/">← Todos los partidos</a>
<h1 id="h1"></h1>
<p class="sub" id="sub"></p>
<section class="stage rv" aria-label="Pizarra del partido">
  <div id="vw"></div>
  <svg id="board" role="img" aria-label="Formación de los equipos"></svg>
  <div id="info"></div>
</section>
<p class="cap" id="cap"></p>
<h2 class="sec rv">Mi lectura</h2>
<p class="lect rv" id="lect"></p>
<h2 class="sec rv">Los números</h2>
<div class="vs rv"><span id="na"></span><span id="nb"></span></div>
<div id="metrics" class="rv"></div>
</div>
<section id="ed" hidden></section>
</main>
<script src="partidos.js"></script>
<script>
/* Si partidos.js no se cargó (por ejemplo en una vista previa), se usa este contenido de ejemplo. */
if(typeof PARTIDOS==="undefined"){
 const J=(p,n)=>Array.from({length:n},(_,i)=>[p+" "+(i+1),"",""]);
 window.NOMBRE="Línea de tres";
 window.PARTIDOS=[
 {id:"ejemplo-1",deporte:"futbol",fecha:"12 de octubre de 2026",resultado:"2-1",a:{nombre:"Equipo A",esquema:"4-3-3",jugadores:J("Jugador A",11)},b:{nombre:"Equipo B",esquema:"4-4-2",jugadores:J("Jugador B",11)},lectura:"Acá va tu análisis del partido.",datos:[["Posesión (%)",58,42],["Remates al arco",7,3]]},
 {id:"ejemplo-2",deporte:"nba",fecha:"15 de octubre de 2026",resultado:"112-104",a:{nombre:"Equipo A",esquema:"",jugadores:J("Jugador A",5)},b:{nombre:"Equipo B",esquema:"",jugadores:J("Jugador B",5)},lectura:"Acá va tu análisis del partido de básquet.",datos:[["Triples convertidos",15,11],["Asistencias",29,22]]}];
}
const $=id=>document.getElementById(id),NS="http://www.w3.org/2000/svg";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const EDIT=location.search.includes("editor");
const FORMS=["4-3-3","4-4-2","3-5-2","4-2-3-1","3-4-3","5-3-2","4-1-4-1","4-5-1","4-1-2-3","3-4-1-2"];
const COURT={futbol:{vb:"0 0 100 64",svg:'<rect class="ln" x="2" y="2" width="96" height="60"/><path class="ln" d="M50 2V62"/><circle class="ln" cx="50" cy="32" r="7"/><rect class="ln" x="82" y="17" width="16" height="30"/><rect class="ln" x="2" y="17" width="16" height="30"/><rect class="ln" x="92" y="25" width="6" height="14"/><rect class="ln" x="2" y="25" width="6" height="14"/>'},
 nba:{vb:"0 0 94 50",svg:'<rect class="ln" x="1" y="1" width="92" height="48"/><rect class="ln" x="1" y="17" width="19" height="16"/><circle class="ln" cx="20" cy="25" r="6"/><path class="ln" d="M1 3.3H15A23.75 23.75 0 0 1 15 46.7H1"/><path class="ln" d="M3.5 22V28"/><circle class="ln" cx="5.25" cy="25" r="1.3"/><path class="ln" d="M93 19A6 6 0 0 0 93 31"/>'}};
const NBAPOS=[[42,25],[28,8],[28,42],[16,16],[13,32]];
function lines(esq,full){
 const L=(esq||"4-3-3").split("-").map(Number),x0=full?24:15,x1=full?80:44,o=[[full?7:5,32]];
 L.forEach((k,i)=>{const x=x0+i*(x1-x0)/Math.max(L.length-1,1);for(let j=0;j<k;j++)o.push([x,k===1?32:9+j*46/(k-1)])});
 return o;
}
let shown=false,pend=null,xt=0,fillM=()=>{};
const bo=window.IntersectionObserver?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&pend){shown=true;const t=pend;pend=null;bo.unobserve(e.target);e.target.classList.add("go");move(t);extras(t)}}),{threshold:.45}):null;
const mo=window.IntersectionObserver?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){fillM();mo.unobserve(e.target)}}),{threshold:.3}):null;
let sport="futbol",idx=0,mode="ambos",nodes=[],pos=[],its=[],raf=0;
const list=()=>PARTIDOS.filter(p=>p.deporte===sport);
const curM=()=>list()[idx];
const ini=n=>String(n).split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

function items(m){
 const r=[],add=(k,rot,full)=>{const t=m[k.toLowerCase()],P=m.deporte==="nba"?NBAPOS:lines(t.esquema,full);
  t.jugadores.forEach((j,i)=>{const p=P[i];if(p)r.push({k,i,j,x:rot?100-p[0]:p[0],y:rot?64-p[1]:p[1]})})};
 if(mode==="ambos"&&m.deporte!=="nba"){add("A",0,0);add("B",1,0)}else add(mode==="B"?"B":"A",0,1);
 return r;
}
function build(n){
 const b=$("board"),c=COURT[sport];b.setAttribute("viewBox",c.vb);
 b.innerHTML='<defs><clipPath id="cp"><circle r="3.8"/></clipPath></defs>'+c.svg;nodes=[];pos=[];b.setAttribute("class",shown||reduce||!bo?"":"ld");b.querySelectorAll(".ln").forEach(e=>e.setAttribute("pathLength","1"));
 for(let i=0;i<n;i++){
  const g=document.createElementNS(NS,"g");g.setAttribute("tabindex","0");
  g.innerHTML='<circle class="ring" r="4.2"/><text class="ini" dy="1"></text><image x="-3.8" y="-3.8" width="7.6" height="7.6" clip-path="url(#cp)" preserveAspectRatio="xMidYMid slice"/><text class="nm" y="7.6"></text>';
  g.onclick=()=>pick(i);g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(i)}};
  b.appendChild(g);nodes.push(g);
 }
}
function draw(){const s=(mode==="ambos"&&sport==="futbol")?.8:1;nodes.forEach((g,i)=>pos[i]&&g.setAttribute("transform","translate("+pos[i][0]+" "+pos[i][1]+") scale("+s+")"))}
function move(t){
 cancelAnimationFrame(raf);const f=pos.map(p=>p.slice());
 if(reduce||f.length!==t.length){pos=t.map(p=>p.slice());draw();return}
 const S=Math.min(28,420/f.length),D=850,t0=performance.now();
 (function s(n){let end=true;pos=f.map((a,i)=>{const k=Math.min(1,Math.max(0,(n-t0-i*S)/D));if(k<1)end=false;const e=ease(k);return[a[0]+(t[i][0]-a[0])*e,a[1]+(t[i][1]-a[1])*e]});draw();if(!end)raf=requestAnimationFrame(s)})(t0);
}
function extras(T){
 clearTimeout(xt);const b=$("board");b.querySelectorAll(".dl,.ball").forEach(e=>e.remove());
 xt=setTimeout(()=>{
  if(sport==="futbol"){["A","B"].forEach(k=>{const m=curM()&&curM()[k.toLowerCase()];if(!m)return;const n=+String(m.esquema||"4-3-3").split("-")[0];
   const P=its.map((o,i)=>[o,T[i]]).filter(x=>x[0].k===k&&x[0].i>=1&&x[0].i<=n).map(x=>x[1]).sort((a,c)=>a[1]-c[1]);
   if(P.length<2||!nodes[0])return;const d=document.createElementNS(NS,"path");d.setAttribute("d","M"+P.map(p=>p.join(" ")).join("L"));d.setAttribute("pathLength","1");d.setAttribute("class","dl "+k);b.insertBefore(d,nodes[0])})}
  else if(!reduce&&T.length>4){
   const ball=document.createElementNS(NS,"circle"),seq=[0,1,3,4].map(i=>T[i]);let leg=0;ball.setAttribute("r","1.3");ball.setAttribute("class","ball");ball.setAttribute("cx",seq[0][0]);ball.setAttribute("cy",seq[0][1]);b.appendChild(ball);
   const run=()=>{if(!ball.isConnected)return;const a=seq[leg],c=seq[leg+1],t0=performance.now();(function f(n){if(!ball.isConnected)return;const k=Math.min(1,(n-t0)/650),e=ease(k);ball.setAttribute("cx",a[0]+(c[0]-a[0])*e);ball.setAttribute("cy",a[1]+(c[1]-a[1])*e);if(k<1)requestAnimationFrame(f);else if(++leg<seq.length-1)setTimeout(run,160);else setTimeout(()=>ball.remove(),1000)})(t0)};run()}
 },reduce?0:1500);
}
function pick(i){
 const m=curM(),o=its[i],j=o.j;
 nodes.forEach((g,k)=>g.classList.toggle("on",k===i));
 $("info").innerHTML=(j[1]?'<img src="fotos/'+esc(j[1])+'" alt="" onerror="this.outerHTML=\'<div class=ph>'+esc(ini(j[0]))+'</div>\'">':'<div class="ph">'+esc(ini(j[0]))+'</div>')+'<div><b>'+esc(j[0])+'</b><small>'+esc(m[o.k.toLowerCase()].nombre)+'</small><p>'+esc(j[2]||"")+'</p></div>';
}
function views(m){
 const v=$("vw");v.innerHTML="";if(!m)return;
 const opts=sport==="nba"?[["A",m.a.nombre,"var(--ac2)"],["B",m.b.nombre,"var(--blue)"]]:[["ambos","Los dos","var(--chalk)"],["A",m.a.nombre,"var(--ac2)"],["B",m.b.nombre,"var(--blue)"]];
 if(!opts.some(o=>o[0]===mode))mode=opts[0][0];
 opts.forEach(o=>{const b=document.createElement("button");b.innerHTML='<i style="background:'+o[2]+'"></i>'+esc(o[1]);b.setAttribute("aria-pressed",o[0]===mode);b.onclick=()=>{mode=o[0];show()};v.appendChild(b)});
}
function show(){
 const m=curM();views(m);
 if(!m){$("h1").textContent="Todavía no hay partidos de este deporte";$("sub").textContent="";$("board").innerHTML="";nodes=[];$("info").innerHTML="";$("lect").textContent="";$("metrics").innerHTML="";return}
 $("h1").innerHTML=esc(m.a.nombre)+' <span class="sc">'+esc(m.resultado)+'</span> '+esc(m.b.nombre);$("cap").textContent="Pizarra del partido. "+m.a.nombre+" en dorado, "+m.b.nombre+" en celeste.";
 $("sub").textContent=m.fecha+". "+(m.a.esquema?m.a.nombre+" formó en "+m.a.esquema+" y "+m.b.nombre+" en "+m.b.esquema+".":"");
 its=items(m);
 if(nodes.length!==its.length)build(its.length);
 its.forEach((o,i)=>{const g=nodes[i],im=g.querySelector("image");
  g.setAttribute("class","pl "+o.k);im.onerror=()=>im.removeAttribute("href");
  o.j[1]?im.setAttribute("href","fotos/"+o.j[1]):im.removeAttribute("href");
  g.querySelector(".ini").textContent=ini(o.j[0]);g.querySelector(".nm").textContent=String(o.j[0]).split(" ").slice(-1)[0]});
 const T=its.map(o=>[o.x,o.y]);
 if(shown||!bo||reduce){move(T);extras(T)}else{const c=sport==="nba"?[92,25]:[50,32];pos=T.map(()=>c.slice());draw();pend=T;bo.observe($("board"))}
 $("info").innerHTML='<p>Tocá un jugador para ver su foto y mi comentario.</p>';
 $("lect").textContent=m.lectura;$("na").textContent=m.a.nombre;$("nb").textContent=m.b.nombre;
 $("metrics").innerHTML=m.datos.map(r=>'<div class="m"><div class="lab">'+esc(r[0])+'</div><div class="split"><span class="a" style="width:50%">'+esc(r[1])+'</span><span class="b" style="width:50%">'+esc(r[2])+'</span></div></div>').join("");
 fillM=()=>[...$("metrics").children].forEach((el,i)=>{const r=m.datos[i],t=(r[1]+r[2])||1;el.querySelector(".a").style.width=r[1]/t*100+"%";el.querySelector(".b").style.width=r[2]/t*100+"%"});
 if(mo)mo.observe($("metrics"));else fillM();
}
let inHome=true,flt="todos";
const pid=(m,i)=>m.id||String(i),SP={futbol:"Fútbol",nba:"NBA"};
const obs=window.IntersectionObserver?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");obs.unobserve(e.target);setTimeout(()=>e.target.style.transitionDelay="",900)}}),{threshold:0,rootMargin:"0px 0px -6% 0px"}):{observe:e=>e.classList.add("in")};
function mini(m){
 const c=COURT[m.deporte];let d="",n=0;
 const dot=(x,y,k)=>{d+='<circle class="dt '+k+'" cx="'+x+'" cy="'+y+'" r="1.9" style="animation-delay:'+(400+n++*45)+'ms"/>'};
 if(m.deporte==="nba")NBAPOS.forEach(p=>dot(p[0],p[1],"A"));
 else{lines(m.a.esquema,0).forEach(p=>dot(p[0],p[1],"A"));lines(m.b.esquema,0).forEach(p=>dot(100-p[0],64-p[1],"B"))}
 return '<svg viewBox="'+c.vb+'" aria-hidden="true">'+c.svg+d+'</svg>';
}
function countUp(el,str,done){
 const n=(str.match(/\d+/g)||[]).map(Number),sep=str.split(/\d+/);
 const set=v=>{el.textContent=sep.map((x,k)=>x+(k<n.length?Math.round(n[k]*v):"")).join("")};
 if(reduce||!n.length){set(1);done&&done();return}
 const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/1100);set(1-Math.pow(1-k,3));if(k<1)requestAnimationFrame(f);else done&&done()})(t0);
}
function renderHome(){
 const f=$("flt");f.innerHTML="";
 [["todos","Todos"],["futbol","Fútbol"],["nba","NBA"]].forEach(o=>{const b=document.createElement("button");b.textContent=o[1];b.setAttribute("aria-pressed",o[0]===flt);b.onclick=()=>{flt=o[0];renderHome()};f.appendChild(b)});
 const L=PARTIDOS.map((m,i)=>[m,i]).filter(x=>flt==="todos"||x[0].deporte===flt);
 const g=$("grid"),F=$("dest");g.innerHTML="";F.innerHTML="";$("mas").hidden=true;
 if(!L.length){g.innerHTML='<p class="sub">Todavía no hay partidos acá.</p>';return}
 const [m0,i0]=L[0];
 const es0=m0.a.esquema?esc(m0.a.esquema+" vs "+m0.b.esquema)+". ":"";
 F.innerHTML='<a class="lead" data-s="'+m0.deporte+'" href="#/partido/'+encodeURIComponent(pid(m0,i0))+'"><div><span class="tag">Último partido · '+esc(m0.fecha)+'</span><h2>'+esc(m0.a.nombre)+'<br>'+esc(m0.b.nombre)+'</h2><div class="big"></div><p>'+es0+'<span class="go">Leer el análisis →</span></p></div><div class="mp">'+mini(m0)+'</div></a>';
 const BG=F.querySelector(".big");countUp(BG,m0.resultado,()=>BG.classList.add("fill"));
 const rest=L.slice(1);$("mas").hidden=!rest.length;
 rest.forEach(([m,i],k)=>{
  const a=document.createElement("a");a.className="row rv";a.style.transitionDelay=(k%8)*90+"ms";a.href="#/partido/"+encodeURIComponent(pid(m,i));
  a.innerHTML='<span class="dt0">'+SP[m.deporte]+' · '+esc(m.fecha)+'</span><h3>'+esc(m.a.nombre)+' vs '+esc(m.b.nombre)+'</h3><span class="sc">'+esc(m.resultado)+'</span><span class="es">'+(m.a.esquema?esc(m.a.esquema+" / "+m.b.esquema):"")+'</span><i>→</i>';
  g.appendChild(a);obs.observe(a)});
}
function route(){
 clearTimeout(xt);
 const mm=decodeURIComponent(location.hash.slice(1)).match(/^\/partido\/(.+)$/),m=mm&&PARTIDOS.find((x,i)=>pid(x,i)===mm[1]);
 inHome=!m;$("inicio").hidden=!inHome;$("vpartido").hidden=inHome;
 document.title=(m?m.a.nombre+" "+m.resultado+" "+m.b.nombre+" · ":"")+NOMBRE+" · Análisis de fútbol y NBA";
 if(inHome){document.body.dataset.sport="futbol";renderHome()}
 else{sport=m.deporte;document.body.dataset.sport=sport;idx=list().indexOf(m);mode=sport==="nba"?"A":"ambos";nodes=[];shown=false;pend=null;show()}
 {const V=inHome?$("inicio"):$("vpartido");V.classList.remove("vin");void V.offsetWidth;V.classList.add("vin");
  V.querySelectorAll(".rv:not(.row)").forEach(e=>{e.classList.remove("in");e.style.transitionDelay="";if(obs.unobserve)obs.unobserve(e);obs.observe(e)});
  if(!inHome){const sc=$("h1").querySelector(".sc");if(sc){sc.classList.remove("stamp");void sc.offsetWidth;sc.classList.add("stamp")}}}
 if(EDIT)ed();scrollTo(0,0);
}
addEventListener("hashchange",route);

/* ---------- Modo editor: solo se abre con ?editor y solo cambia TU copia ---------- */
const $e=(t,c,k)=>{const e=document.createElement(t);if(c)e.className=c;(k||[]).forEach(x=>e.append(x));return e};
const inp=(v,fn,tp,ph)=>{const a=tp==="area",i=$e(a?"textarea":"input");if(tp&&!a)i.type=tp;if(ph)i.placeholder=ph;i.value=v;i.oninput=()=>{fn(tp==="number"?(parseFloat(i.value)||0):i.value);sync()};return i};
const fld=(l,e)=>{const x=$e("label","fl",[l]);x.append(e);return x};
const btn=(t,fn,c)=>{const b=$e("button",c||"mini",[t]);b.type="button";b.onclick=fn;return b};
function sync(){try{localStorage.setItem("lt-borrador",JSON.stringify({n:NOMBRE,p:PARTIDOS}))}catch(e){}
 $("brand").textContent=NOMBRE;renderHome();if(!inHome)show()}
function add(sp){const n=nuevo(sp);PARTIDOS.unshift(n);sync();location.hash="#/partido/"+n.id}
function nuevo(sp){const n=sp==="nba"?5:11,eq=t=>({nombre:t,esquema:sp==="nba"?"":"4-3-3",jugadores:Array.from({length:n},(_,i)=>["Jugador "+(i+1),"",""])});
 return{id:Date.now().toString(36),deporte:sp,fecha:"",resultado:"0-0",a:eq("Equipo A"),b:eq("Equipo B"),lectura:"",datos:[["Dato",1,1]]}}
function dl(){const t="/* Contenido de Línea de tres. Generado desde el modo editor. */\nvar NOMBRE = "+JSON.stringify(NOMBRE)+";\nconst PARTIDOS = "+JSON.stringify(PARTIDOS,null,1)+";\n";
 const a=$e("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/javascript"}));a.download="partidos.js";a.click()}
function teamEd(t,title){
 const sel=$e("select");FORMS.forEach(f=>sel.append($e("option","",[f])));sel.value=t.esquema;sel.onchange=()=>{t.esquema=sel.value;sync()};
 return $e("div","box",[$e("h3","",[title]),fld("Nombre del equipo",inp(t.nombre,v=>t.nombre=v)),...(sport==="nba"?[]:[fld("Esquema (cómo se paró)",sel)]),
  $e("p","hint",[sport==="nba"?"Orden: base, escolta, alero, ala-pívot, pívot.":"Orden: arquero, y después cada línea de izquierda a derecha, de la defensa al ataque."]),
  ...t.jugadores.map(j=>$e("div","prow",[inp(j[0],v=>j[0]=v,0,"Nombre"),inp(j[1],v=>j[1]=v,0,"foto.jpg"),inp(j[2],v=>j[2]=v,0,"Tu comentario")]))]);
}
function ed(){
 const E=$("ed");E.hidden=false;E.innerHTML="";const m=inHome?null:curM();
 E.append($e("h2","",["Modo editor"]),$e("p","hint",["Esto es solo para vos: tus cambios se guardan en este navegador y no los ve nadie hasta que descargues partidos.js y lo subas a GitHub."]),
  $e("div","",[btn("+ Partido de fútbol",()=>add("futbol")),btn("+ Partido de NBA",()=>add("nba")),btn("Descargar partidos.js",dl,"mini ok"),btn("Descartar borrador",()=>{try{localStorage.removeItem("lt-borrador")}catch(e){}location.reload()},"mini del")]),
  fld("Nombre del sitio",inp(NOMBRE,v=>NOMBRE=v)));
 if(!m){E.append($e("p","hint",["Entrá a un partido para editar sus jugadores, esquemas y números."]));return}
 E.append($e("h3","",["Partido seleccionado"]),fld("Fecha",inp(m.fecha,v=>m.fecha=v,0,"12 de octubre de 2026")),fld("Resultado",inp(m.resultado,v=>m.resultado=v,0,"2-1")),
  $e("div","two",[teamEd(m.a,"Equipo A (color dorado)"),teamEd(m.b,"Equipo B (color celeste)")]),
  fld("Mi lectura",inp(m.lectura,v=>m.lectura=v,"area")),$e("h3","",["Los números"]),$e("p","hint",["Dato, número de A, número de B"]),
  ...m.datos.map((r,j)=>$e("div","drow",[inp(r[0],v=>r[0]=v),inp(r[1],v=>r[1]=v,"number"),inp(r[2],v=>r[2]=v,"number"),btn("Quitar",()=>{m.datos.splice(j,1);sync();ed()})])),
  btn("+ Agregar dato",()=>{m.datos.push(["Dato",1,1]);sync();ed()}),
  btn("Borrar este partido",()=>{if(confirm("¿Borrar este partido?")){PARTIDOS.splice(PARTIDOS.indexOf(m),1);sync();location.hash="#/"}},"mini del"));
}
if(EDIT){try{const s=JSON.parse(localStorage.getItem("lt-borrador")||"null");if(s){NOMBRE=s.n;PARTIDOS.length=0;PARTIDOS.push(...s.p)}}catch(e){}}
$("brand").textContent=NOMBRE;
route();
